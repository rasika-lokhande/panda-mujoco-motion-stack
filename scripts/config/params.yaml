scene: SCENE_SHELF_PATH   # key into src/config.yaml
seed: 10
viewer: true
wait_for_start: true     # viewer only: after the first path is drawn, wait for SPACE before moving (not in interactive mode)

target:
  mode: sequence           # "blocked_pair" | "fixed" | "interactive" (drag target in viewer, ENTER to go) | "sequence"
  pos: null                # used only when mode == fixed
  quat: null

  # used only when mode == sequence; for SCENE_SHELF_PATH. quat is w, x, y, z
  # every move below is blocked in a straight line and needs a multi-waypoint detour
  pause: 1.0               # viewer only: seconds to show each planned path before moving (not in interactive mode)
  sequence:
    - name: lower shelf slot
      pos: [0.38, -0.40, 0.30]
      quat: [0.5, 0.5, -0.5, 0.5]         # pointing into the shelf (-y)
    - name: upper shelf slot               # back out, over the middle board, back in
      pos: [0.38, -0.40, 0.58]
      quat: [0.5, 0.5, -0.5, 0.5]
    - name: left of the divider            # out of the shelf and over the divider
      pos: [0.45, 0.30, 0.12]
      quat: [0.0, 0.7071, -0.7071, 0.0]   # pointing down
    - name: lower shelf slot               # back over the divider and into the shelf
      pos: [0.38, -0.40, 0.30]
      quat: [0.5, 0.5, -0.5, 0.5]

# target:
#   mode: fixed
#   pos: [0.03112691, -0.2918927, 0.45697028]
#   quat: [0.72794075, 0.43195954, -0.34163211, -0.40841243]   # w, x, y, z — verified reachable & collision-free in SCENE_EASY_PATH


planner:
  max_retries: 5
  smoothing: true
  rrt_kwargs:
    max_iter: 1000
    step_size: 0.15
    radius: 0.225
    goal_tol: 0.1

controller:
  Kp_pos: 380
  Ki_pos: 0.0
  Kd_pos: 0.0
  Kp_rot: 300
  Ki_rot: 0.0
  Kd_rot: 0.0
  lam: 0.01
  pos_tol: 0.005
  rot_tol: 0.035
  pos_tol_intermediate: 0.03
  rot_tol_intermediate: 0.15
  settle_window: 0.1       # final waypoint
  settle_window_intermediate: 0.0
  max_iter: 5000

execution:
  failure_retries: 3
